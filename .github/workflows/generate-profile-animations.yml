name: Generate ALTECH Profile Animations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate ALTECH animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/generate-altech-animations
          python scripts/generate-cyber-grid.py

      - name: Verify generated files
        run: |
          echo "=== GENERATED FILES ==="
          ls -lah dist/
          test -f dist/ai-neural-core.gif
          test -f dist/iot-network.gif
          test -f dist/embedded-boot.gif
          test -f dist/cyber-radar.gif
          test -f dist/cyber-contribution-grid.gif
          echo "=== ALL 5 ANIMATIONS EXIST ==="

      - name: Publish animations to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Update ALTECH profile animations [skip ci]"
