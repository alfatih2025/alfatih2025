# ==============================================================================
# Workflow ini men-generate animasi "ular" yang memakan kotak-kotak kontribusi
# GitHub kamu, lalu menyimpan hasilnya sebagai SVG yang otomatis diperbarui.
#
# CARA PAKAI:
# 1. Simpan file ini di repo profil kamu (repo bernama sama dengan username)
#    pada path:  .github/workflows/snake-animation.yml
# 2. Buka tab "Actions" di repo tsb, aktifkan workflow kalau diminta.
# 3. Jalankan sekali secara manual: tab Actions -> "Generate Snake Animation"
#    -> "Run workflow". Ini akan membuat branch baru bernama "output".
# 4. Buka README.md, hapus tanda komentar <!-- --> di bagian "Contribution
#    Snake" supaya gambarnya tampil.
# Setelah itu, animasi akan otomatis diperbarui tiap hari.
# ==============================================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"    # jam 00:00 UTC setiap hari
  workflow_dispatch: {}     # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake SVG to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          commit_message: "Update snake animation [skip ci]"
